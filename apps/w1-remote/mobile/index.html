<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: wss: http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>W1 Harness</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="back" class="quiet hidden" aria-label="返回">‹</button><img src="mark.svg" alt="W1"><span>HARNESS</span><span id="connection" class="badge">未连接</span><button id="settings" class="quiet" aria-label="设备设置">⚙</button></header>
<main>
<section id="pair" class="page pairing"><p class="eyebrow">YOUR WORK, WITH YOU</p><h1>把正在做的事<br>带在身边。</h1><p class="muted">连接电脑上的 W1，随时查看进度，继续对话。</p><div class="connect-card"><div class="device-art">⌘</div><h2>连接你的电脑</h2><p>在电脑 W1 中打开「应用 → 远程设备」，生成二维码。</p><button id="scan" class="primary">扫描二维码</button><details><summary>手动粘贴配对信息</summary><textarea id="pairText" placeholder="粘贴电脑端复制的配对信息"></textarea><button id="pairSubmit">连接</button></details></div><p id="pairStatus" class="muted">首次确认后，会记住这台电脑。</p></section>
<section id="list" class="page hidden"><div class="page-heading"><div><p class="eyebrow" id="hostName">已连接电脑</p><h1>你的工作</h1></div><button id="refresh" class="quiet">刷新</button></div><input id="search" type="search" placeholder="搜索会话标题"><div id="projects"></div></section>
<section id="chat" class="page hidden"><div class="chat-heading"><h2 id="chatTitle">会话</h2><span id="taskState" class="muted"></span></div><div id="messages" role="log"><button id="older" class="quiet hidden">加载更早记录</button><div id="history"></div><article id="live" class="assistant hidden"><label>W1 · 正在回复</label><div></div></article></div><form id="composer"><div class="composer-options"><select id="delivery" aria-label="发送方式"><option value="queue">排队发送</option><option value="steer">立即引导</option></select><button id="stop" type="button" class="quiet">停止任务</button></div><textarea id="draft" rows="2" placeholder="发送消息，继续这项工作"></textarea><div class="composer-footer"><span id="sendState" class="muted"></span><button id="send" class="primary" type="submit">发送 ↑</button></div></form></section>
<section id="device" class="page hidden"><h1>远程设备</h1><div class="connect-card"><h2 id="deviceName"></h2><p id="relayAddress" class="muted"></p><p>会话与执行留在电脑上。手机和电脑通过加密连接同步。</p><button id="reconnect">重新连接</button><button id="forget" class="danger">移除本机绑定</button><p class="muted">解除访问授权，请在电脑「远程设备」中移除这台手机。</p></div><p class="muted">W1 Mobile 0.1.0 · 首版支持文字与工具摘要。图片附件、系统通知与远程审批将在后续加入。</p></section>
</main><div id="toast" class="hidden" role="status"></div><script type="module" src="app.mjs"></script></body></html>
